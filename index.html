<title>Homepage V1.17</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  min-height: 100vh;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #e0e0e0;
  background: #121212;
  display: flex;
}
.sidebar {
  width: 220px;
  background: #1a1a1a;
  border-right: 1px solid #2a2a2a;
  padding: 24px 16px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar-logo {
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-logo span { color: #6c5ce7; }
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar-link {
  padding: 10px 12px;
  border-radius: 8px;
  color: #888;
  font-size: 0.85rem;
  cursor: pointer;
  transition: 0.2s;
  background: transparent;
  border: none;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-link:hover, .sidebar-link:active { background: #252525; color: #e0e0e0; }
.sidebar-link.active { background: #6c5ce720; color: #6c5ce7; }
.sidebar-link .ico { font-size: 1rem; }
.sidebar-bottom {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #2a2a2a;
  font-size: 0.75rem;
  color: #555;
}
.mobile-top {
  display: none;
  position: sticky;
  top: 0;
  z-index: 99;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  padding: 12px 16px;
  align-items: center;
  justify-content: space-between;
}
.hamburger {
  background: none;
  border: none;
  color: #e0e0e0;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px 8px;
  display: flex;
  align-items: center;
}
.mobile-top-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mobile-top-title span { color: #6c5ce7; }
.mobile-top-time {
  font-size: 0.85rem;
  color: #6c5ce7;
  font-weight: 300;
  letter-spacing: 0.5px;
}
.overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}
.main {
  flex: 1;
  padding: 28px 32px;
  max-width: calc(100% - 220px);
  overflow-y: auto;
  min-height: 100vh;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.top-bar h1 {
  font-size: 1.5rem;
  font-weight: 600;
  color: #fff;
}
.top-bar h1 small {
  font-size: 1.4rem;
  font-weight: 400;
  color: #666;
  margin-left: 8px;
}
#timeDisplay {
  font-size: 1.8rem;
  font-weight: 300;
  color: #ffffff;
  letter-spacing: 1px;
}
.search-section {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}
.search-bar-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.search-bar-wrap .g-btn {
  flex-shrink: 0;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}
.search-bar-wrap .g-btn img {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: #252525;
  padding: 4px;
  transition: 0.2s;
}
.search-bar-wrap .g-btn:hover img, .search-bar-wrap .g-btn:active img { background: #333; }
.search-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: #252525;
  border-radius: 8px;
  border: 1px solid #333;
  transition: 0.2s;
}
.search-input-wrap:focus-within { border-color: #6c5ce7; }
#inputbox {
  flex: 1;
  background: transparent;
  border: none;
  padding: 12px 16px;
  font-size: 16px;
  color: #e0e0e0;
  outline: none;
  font-family: inherit;
}
#micbtn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#micbtn img { width: 22px; height: 22px; opacity: 0.6; }
#micbtn:hover img, #micbtn:active img { opacity: 1; }
.search-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.search-actions .imgbtns {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}
.search-actions .imgbtns img {
  width: 40px; height: 40px;
  border-radius: 8px;
  background: #252525;
  padding: 6px;
  transition: 0.2s;
}
.search-actions .imgbtns:hover img, .search-actions .imgbtns:active img { background: #333; }
.dashboard-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
  justify-content: center;
}
.dashboard-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 16px 10px;
  transition: 0.25s;
  cursor: pointer;
  text-align: center;
  user-select: none;
  width: 130px;
}
.dashboard-card:hover, .dashboard-card:active {
  border-color: #6c5ce755;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.dashboard-card img {
  width: 44px; height: 44px;
  border-radius: 10px;
  object-fit: cover;
  margin-bottom: 8px;
  display: inline-block;
}
.dashboard-card .card-label {
  font-size: 0.75rem;
  color: #888;
  display: block;
}
.section-heading {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #ffffff;
  margin: 20px 0 10px;
  font-weight: 600;
  text-align: center;
}
.btns-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  justify-content: center;
}
.btns {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 12px 20px;
  color: #ccc;
  font-size: 0.9rem;
  cursor: pointer;
  transition: 0.2s;
  font-family: inherit;
  user-select: none;
}
.btns:hover, .btns:active {
  border-color: #6c5ce7;
  color: #fff;
}
form { width: 100%; }

@media (max-width: 768px) {
  body { flex-direction: column; }
  .mobile-top { display: flex; }
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    transform: translateX(-100%);
    height: 100vh;
    z-index: 101;
  }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }
  .main {
    max-width: 100%;
    padding: 16px;
  }
  .top-bar { display: none; }
  .search-section { padding: 14px; margin-bottom: 16px; }
  .search-bar-wrap .g-btn img { width: 34px; height: 34px; }
  #inputbox { padding: 10px 12px; font-size: 16px; }
  #micbtn { padding: 8px; }
  #micbtn img { width: 20px; height: 20px; }
  .search-actions { gap: 5px; }
  .search-actions .imgbtns img { width: 36px; height: 36px; padding: 5px; }
  .dashboard-grid { gap: 8px; }
  .dashboard-card { padding: 12px 6px; width: 100px; }
  .dashboard-card img { width: 38px; height: 38px; }
  .dashboard-card .card-label { font-size: 0.7rem; }
  .section-heading { margin: 14px 0 8px; font-size: 0.75rem; }
  .btns-group { gap: 6px; }
  .btns { padding: 10px 14px; font-size: 0.8rem; }
}
</style>
<script type="text/javascript">
function updateTime() {
  var dt = new Date();
  var hr = dt.getHours(); var mn = dt.getMinutes(); var sc = dt.getSeconds();
  var mar = 'AM';
  if (hr > 11) {var mar = 'PM';}
  if (hr > 12) {var hr = hr - 12;}
  if (hr < 10) {var hr = '0'+hr;}
  if (mn < 10) {var mn = '0'+mn;}
  if (sc < 10) {var sc = '0'+sc;}
  document.getElementById('timeDisplay').innerHTML = hr + ':' + mn + ':' + sc + ' ' + mar;
  var t2 = document.getElementById('mobileTimeDisplay');
  if (t2) t2.innerHTML = hr + ':' + mn + ':' + sc + ' ' + mar;
}
function getBrowserDetails() {
  var isChromium = window.chrome;
  var winNav = window.navigator;
  var vendorName = winNav.vendor;
  var isOpera = typeof window.opr !== "undefined";
  var isIEedge = winNav.userAgent.indexOf("Edg") > -1;
  var isIOSChrome = winNav.userAgent.match("CriOS");
  if (isIOSChrome) {
     var browserName = 'ChromeIOS';
     var hisUrl = 'chrome://history/';
     var clearHisUrl = 'chrome://settings/clearBrowserData';
  } else if(
    isChromium !== null &&
    typeof isChromium !== "undefined" &&
    vendorName === "Google Inc." &&
    isOpera === false &&
    isIEedge === false
  ) {
     var browserName = 'Chrome';
     var hisUrl = 'chrome://history/';
     var clearHisUrl = 'chrome://settings/clearBrowserData';
  } else if(isIEedge) {
     var browserName = 'Edge';
     var hisUrl = 'edge://history';
     var clearHisUrl = 'edge://settings/clearBrowserData';
  } else if(isOpera) {
     var browserName = 'Opera';
     var hisUrl = 'opera://history/';
     var clearHisUrl = 'opera://settings/clearBrowserData';
  } else if(winNav.userAgent.toLowerCase().index("mozil") > -1) {
     var browserName = 'Mozilla';
     var hisUrl = 'mozilla://history/';
     var clearHisUrl = 'mozilla://settings/clearBrowserData';
  }
  return [browserName, hisUrl, clearHisUrl]
}
const browserComponents = getBrowserDetails();
const browserHistoryUrl = browserComponents[1];
const ClearBrowserHistoryUrl = browserComponents[2];
function openHistory() {
  window.location.href = browserHistoryUrl;
}
function openClearHistory() {
  window.location.href = ClearBrowserHistoryUrl;
}
function FormUrl(q) {
  var url = 'https://www.google.com/?igu=1';
  if (q.trim() != '') {
    var imageKey = ' images pics pictures wallpapers photos memes gifs drawings arts outlines icons logos posters ';
    var imageKey = imageKey + ' image pic picture wallpaper photo meme gif drawing art outline icon logo poster ';
    var videoKey = ' videos tapes dvds recordings trailers scenes bloopers ';
    var mapKey = ' maps gps ';
    var mapKey = mapKey + ' map ';
    var flightKey = ' flights aeroplanes airplanes planes aircrafts flying airways ';
    var flightKey = flightKey + ' flight aeroplane airplane plane aircraft fly airway ';
    var qLower = q.toLowerCase().trim().replace(/ of /g, ' ').replace(/ to /g, ' ').replace(/ toward /g, ' ').replace(/ towards /g, ' ');
    var url = '';
    for (a=0; a<qLower.split(' ').length; a++) {
      var word = qLower.split(' ')[a];
      if (mapKey.indexOf(' '+word+' ') > -1) {
        var finalKey = word;
        var url = 'https://www.google.com/maps?q='+q.trim().toLowerCase().replace(/ /g, '+')+'&igu=1';
      }
      if (flightKey.indexOf(' '+word+' ') > -1) {
        var finalKey = word;
        var url = 'https://www.google.com/travel/flights?q='+q.trim().toLowerCase().replace(/ /g, '+')+'&igu=1';
      }
    }
    if (q.indexOf(' ') > -1 && url == '') {
      var url = 'https://www.google.com/search?q=show+'+q.trim().toLowerCase().replace(/ /g, '+')+'&btnI';
      console.log("With Space But No URL => " + url);
    } else {
      if (url == '') {
        if (q.indexOf('.co') > -1 || q.indexOf('www.') > -1 || q.indexOf('.desi') > -1 || q.indexOf('https://') > -1 || q.indexOf('.tv') > -1 || q.indexOf('.in') > -1 || q.indexOf('.ai') > -1 || q.indexOf('.io') > -1 || q.indexOf('.app') > -1 || q.indexOf('.org') > -1 || q.indexOf('.desi') > -1 || q.indexOf('.health') > -1 || q.indexOf('.uk') > -1) {
          var url = 'https://'+q.trim();
          var url = "https://www.google.com/search?q="+url.replace('https://https://', 'https://')+'&btnI';
          console.log("Without Space And No URL contains .com=> " + url);
        } else {
          var url = 'https://www.google.com/search?q=show+'+q.trim().toLowerCase().replace(/ /g, '+')+'&btnI';
          console.log("Without Space And No URL not containing .com=> " + url);
        }
      }
    }
  }
  var url = ""+url;
  console.log("Form Url => " + url);
  return url
}
function searchQuery(q) {
  var url = FormUrl(q);
  console.log("Opening URL Before Changes => " + url);
  console.log("Opening URL After Changes => " + url.replace(/&igu=1/g, '').replace(/igu=1/g, ''));
  window.open(url.replace(/&igu=1/g, '').replace(/igu=1/g, ''), target="_blank");
}
function privacyCheckAndDisplay(a) {
  var ele = document.getElementById(a);
  document.cookie = 'normal';
  var c = document.cookie;
  if (c != 'normal') {
    console.log('Cookie Not Stored Therefore It Is Incognito Mode.');
    ele.style.display = 'inline-block';
  }
  document.cookie = '';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
</script>
